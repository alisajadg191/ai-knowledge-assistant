spring.application.name=ai-knowledge-assistant
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/knowledge}
spring.datasource.username=${DATABASE_USER:knowledge}
spring.datasource.password=${DATABASE_PASSWORD:knowledge_local}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.chat.options.num-predict=700
spring.ai.ollama.chat.options.num-ctx=8192
spring.ai.ollama.embedding.options.model=${EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.retry.max-attempts=1
app.embedding-model=${EMBEDDING_MODEL:nomic-embed-text}
app.deadline-seconds=${AI_DEADLINE_SECONDS:120}
app.similarity-threshold=${SIMILARITY_THRESHOLD:0.45}
